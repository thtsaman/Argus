services:
  postgres:
    image: postgres:16-alpine
    container_name: investigation-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: investigation
      POSTGRES_PASSWORD: investigation
      POSTGRES_DB: investigation
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
